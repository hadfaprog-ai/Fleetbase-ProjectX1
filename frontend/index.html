<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WIM Fleetbase — Masuk</title>
<link rel="stylesheet" href="css/app.css">
<style>
.login-page {
  min-height: 100vh;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.login-logo {
  text-align: center;
  margin-bottom: 24px;
}
.login-logo .logo-icon {
  width: 64px;
  height: 64px;
  background: var(--blue);
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--white);
  margin-bottom: 12px;
}
.login-logo h2 { font-size: 20px; color: var(--gray-700); }
.login-logo p { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
.login-footer {
  text-align: center;
  margin-top: 16px;
  font-size: 11px;
  color: var(--gray-400);
}
.error-msg {
  background: #FEE2E2;
  color: #991B1B;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  margin-bottom: 12px;
  display: none;
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <h2>WIM Fleetbase</h2>
      <p>PT Wahana Inti Mas</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label class="form-label">Email / Username</label>
      <input class="form-input" id="username" type="text" placeholder="admin@wim.fleet" autocomplete="username" value="reinharttanto@gmail.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-lg" id="loginBtn" onclick="handleLogin()">
      Masuk
    </button>

    <div class="login-footer">
      <p>WIM Fleetbase v1.0 — Staging</p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');

  if (!username || !password) {
    errEl.textContent = 'Masukkan email dan password';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Memproses...';
  errEl.style.display = 'none';

  // For demo purposes, we authenticate directly against Fleetbase API
  // Then store token + navigate to dashboard
  try {
    WIM_API.init({
      token: 'flb_live_RgeKNhT7Pg8rCcuXp8sD',
      baseURL: 'http://192.168.6.223:8000/v1',
      driverId: 'bdd47b89-9ca9-4452-a29c-2bc603347c78',
    });

    // Verify API works
    const places = await WIM_API.getPlaces();
    if (Array.isArray(places) && places.length > 0) {
      // Store session
      sessionStorage.setItem('wim_token', WIM_API.token);
      sessionStorage.setItem('wim_base_url', WIM_API.baseURL);
      sessionStorage.setItem('wim_driver_id', WIM_API.driverId);
      sessionStorage.setItem('wim_user', username);
      window.location.href = 'dashboard.html';
    } else {
      throw new Error('API tidak merespon dengan benar');
    }
  } catch (e) {
    errEl.textContent = `Gagal: ${e.message}`;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
}

// Handle Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
